<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中村工務店 | 家に、木のぬくもりを。</title>
  <meta name="description" content="暮らしに寄り添う家づくりを。自然素材と職人の技で、長く住める木の家をつくります。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="canonical" href="#">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <!-- ローディング -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__inner">
      <svg class="loader__house" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path class="draw" d="M8 40 L40 12 L72 40"/>
        <path class="draw" d="M16 36 V68 H64 V36"/>
        <path class="draw" d="M32 68 V48 H48 V68"/>
        <path class="draw" d="M54 22 V14 H62 V28"/>
      </svg>
      <p class="loader__name">中村工務店</p>
      <div class="loader__bar"><span id="loaderBar"></span></div>
      <p class="loader__count"><span id="loaderNum">0</span>%</p>
    </div>
    <div class="loader__panel loader__panel--l"></div>
    <div class="loader__panel loader__panel--r"></div>
  </div>

  <!-- ヘッダー -->
  <header class="header" id="header">
    <a href="#top" class="logo" aria-label="中村工務店 トップへ">
      <svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 40 L40 12 L72 40"/><path d="M16 36 V68 H64 V36"/><path d="M32 68 V48 H48 V68"/><path d="M54 22 V14 H62 V28"/>
      </svg>
      <span>中村工務店</span>
    </a>
    <nav class="nav" id="nav">
      <ul>
        <li><a href="#concept">家づくり</a></li>
        <li><a href="#works">施工事例</a></li>
        <li><a href="#company">会社案内</a></li>
        <li><a href="#contact">お問い合わせ</a></li>
      </ul>
    </nav>
    <button class="burger" id="burger" aria-label="メニューを開く" aria-expanded="false"><span></span><span></span></button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__bg"><img src="images/top_image.jpg" alt="木の梁と大きな窓のあるリビングダイニング"></div>
      <div class="hero__shade"></div>

      <div class="hero__copy">
        <h1 class="hero__title">
          <span class="line" data-split>家に、</span>
          <span class="line" data-split>木のぬくもりを。</span>
        </h1>
        <p class="hero__lead fade-up" style="--d:1.6s">暮らしに寄り添う家づくりを。</p>
        <a href="#concept" class="btn fade-up" style="--d:1.9s">
          <span>私たちについて</span>
          <svg viewBox="0 0 24 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h22M18 1l4 4-4 4"/></svg>
        </a>
      </div>

      <svg class="hero__wave" viewBox="0 0 1440 140" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave-a" d="M0 70 C240 10 420 20 700 70 S1180 130 1440 50 V140 H0Z" fill="#fbf3e6" opacity=".55"/>
        <path class="wave-b" d="M0 95 C260 40 520 60 760 95 S1200 130 1440 80 V140 H0Z" fill="#fbf3e6"/>
      </svg>

      <!-- 舞う葉 -->
      <div class="leaves" aria-hidden="true">
        <svg class="leaf l1" viewBox="0 0 40 60"><path d="M20 2 C38 18 38 42 20 58 C2 42 2 18 20 2Z" fill="#7aa35a"/><path d="M20 10 V54" stroke="#fbf3e6" stroke-width="1.2" opacity=".6"/></svg>
        <svg class="leaf l2" viewBox="0 0 40 60"><path d="M20 2 C38 18 38 42 20 58 C2 42 2 18 20 2Z" fill="#9bbf74"/><path d="M20 10 V54" stroke="#fbf3e6" stroke-width="1.2" opacity=".6"/></svg>
        <svg class="leaf l3" viewBox="0 0 40 60"><path d="M20 2 C38 18 38 42 20 58 C2 42 2 18 20 2Z" fill="#6c944d"/><path d="M20 10 V54" stroke="#fbf3e6" stroke-width="1.2" opacity=".6"/></svg>
        <svg class="leaf l4" viewBox="0 0 40 60"><path d="M20 2 C38 18 38 42 20 58 C2 42 2 18 20 2Z" fill="#8fb36a"/><path d="M20 10 V54" stroke="#fbf3e6" stroke-width="1.2" opacity=".6"/></svg>
      </div>
    </section>

    <!-- 特徴 -->
    <section class="features" id="concept">
      <ul class="features__list">
        <li class="feature reveal" style="--i:0">
          <a href="#concept">
            <svg viewBox="0 0 48 48" fill="#4f7d3a"><path d="M24 4 L34 18 H29 L38 30 H30 L40 42 H8 L18 30 H10 L19 18 H14 Z"/><rect x="22" y="40" width="4" height="6" fill="#8a5a33"/></svg>
            <span>自然素材<br>の家</span>
          </a>
        </li>
        <li class="feature reveal" style="--i:1">
          <a href="#concept">
            <svg viewBox="0 0 48 48" fill="none" stroke="#8a5a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6 L40 16 L34 22 L26 14 Z" fill="#8a5a33"/><path d="M30 18 L10 42"/><path d="M8 44 L12 40" /></svg>
            <span>職人の技</span>
          </a>
        </li>
        <li class="feature reveal" style="--i:2">
          <a href="#concept">
            <svg viewBox="0 0 48 48" fill="none" stroke="#8a5a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24 L24 8 L42 24"/><path d="M11 21 V40 H37 V21"/><path d="M19 40 V29 H29 V40"/></svg>
            <span>安心の施工</span>
          </a>
        </li>
        <li class="feature reveal" style="--i:3">
          <a href="#concept">
            <svg viewBox="0 0 48 48"><path d="M40 6 C16 6 8 18 8 30 C8 34 10 38 12 40 C14 28 22 20 34 16 C26 22 20 30 18 42 C34 40 42 28 40 6Z" fill="#7aa35a"/></svg>
            <span>長く住める家</span>
          </a>
        </li>
      </ul>
    </section>

    <!-- 施工事例 -->
    <section class="works" id="works">
      <div class="works__head reveal">
        <h2>施工事例</h2>
        <p>私たちが手がけた家をご紹介します</p>
        <a href="#works" class="more">
          <span>もっと見る</span>
          <svg viewBox="0 0 24 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h22M18 1l4 4-4 4"/></svg>
        </a>
      </div>

      <div class="works__grid">
        <a href="#works" class="card reveal" style="--i:0">
          <div class="card__img"><img src="images/case1.jpg" alt="青空の下に建つ木の家の外観" loading="lazy"></div>
          <div class="card__cap"><span>自然素材の家</span><small>延床 32坪 / 2階建て</small></div>
        </a>
        <a href="#works" class="card reveal" style="--i:1">
          <div class="card__img"><img src="images/case2.jpg" alt="梁が美しい明るいダイニング" loading="lazy"></div>
          <div class="card__cap"><span>光あふれるダイニング</span><small>延床 28坪 / 平屋風</small></div>
        </a>
        <a href="#works" class="card reveal" style="--i:2">
          <div class="card__img"><img src="images/case3.jpg" alt="ウッドデッキのある木の家の外観" loading="lazy"></div>
          <div class="card__cap"><span>デッキのある暮らし</span><small>延床 35坪 / 2階建て</small></div>
        </a>
      </div>

      <svg class="deco deco--l" viewBox="0 0 120 160" aria-hidden="true"><g fill="#7aa35a"><path d="M10 150 C30 110 40 70 70 20" stroke="#6c944d" stroke-width="2" fill="none"/><ellipse cx="44" cy="96" rx="16" ry="8" transform="rotate(-40 44 96)"/><ellipse cx="62" cy="62" rx="15" ry="7" transform="rotate(-55 62 62)"/><ellipse cx="26" cy="124" rx="15" ry="7" transform="rotate(-20 26 124)"/><ellipse cx="72" cy="30" rx="12" ry="6" transform="rotate(-70 72 30)"/></g></svg>
      <svg class="deco deco--r" viewBox="0 0 120 160" aria-hidden="true"><g fill="#8fb36a"><path d="M110 150 C90 110 80 70 50 20" stroke="#6c944d" stroke-width="2" fill="none"/><ellipse cx="76" cy="96" rx="16" ry="8" transform="rotate(40 76 96)"/><ellipse cx="58" cy="62" rx="15" ry="7" transform="rotate(55 58 62)"/><ellipse cx="94" cy="124" rx="15" ry="7" transform="rotate(20 94 124)"/><ellipse cx="48" cy="30" rx="12" ry="6" transform="rotate(70 48 30)"/></g></svg>
    </section>

  <footer class="footer" id="company">
    <p class="footer__logo">中村工務店</p>
    <p class="footer__sub" id="contact">家づくりのご相談はお気軽に。</p>
    <small>&copy; <span id="year">2026</span> Ki-no-Ie Koumuten</small>
  </footer>
